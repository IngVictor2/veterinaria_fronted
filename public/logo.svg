<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="inner">
      <circle cx="100" cy="100" r="82"/>
    </clipPath>
  </defs>

  <!-- White outer border -->
  <circle cx="100" cy="100" r="98" fill="white"/>
  <!-- Teal ring -->
  <circle cx="100" cy="100" r="90" fill="#0D7377"/>
  <!-- Inner teal background -->
  <circle cx="100" cy="100" r="82" fill="#2E9EAA"/>

  <!-- ===== DOG (left side) ===== -->
  <g clip-path="url(#inner)">
    <g transform="translate(22, 38)">
      <!-- Dog body -->
      <path d="M15,85 Q10,70 18,58 Q25,48 40,45 Q55,48 62,58 Q70,70 65,85 Q50,95 35,95 Z" fill="#D4A030" stroke="#B8862A" stroke-width="2"/>
      <!-- Dog chest/belly -->
      <path d="M25,75 Q30,65 40,62 Q50,65 55,75 Q50,88 40,90 Q30,88 25,75Z" fill="#E8C860"/>
      <!-- Dog head -->
      <ellipse cx="40" cy="35" rx="24" ry="22" fill="#D4A030" stroke="#B8862A" stroke-width="2"/>
      <!-- Dog face/muzzle area -->
      <ellipse cx="40" cy="40" rx="14" ry="12" fill="#E8C860"/>
      <!-- Dog left ear (floppy) -->
      <path d="M18,28 Q10,20 8,32 Q6,44 14,48 Q18,42 18,28Z" fill="#C4922A" stroke="#B8862A" stroke-width="1.5"/>
      <!-- Dog right ear (floppy) -->
      <path d="M62,28 Q70,20 72,32 Q74,44 66,48 Q62,42 62,28Z" fill="#C4922A" stroke="#B8862A" stroke-width="1.5"/>
      <!-- Dog forehead lighter patch -->
      <path d="M30,26 Q40,20 50,26 Q45,32 40,34 Q35,32 30,26Z" fill="#E8C860"/>
      <!-- Dog eyes -->
      <ellipse cx="32" cy="33" rx="4" ry="4.5" fill="#1A1A1A"/>
      <ellipse cx="48" cy="33" rx="4" ry="4.5" fill="#1A1A1A"/>
      <!-- Eye highlights -->
      <circle cx="33.5" cy="31.5" r="1.5" fill="white"/>
      <circle cx="49.5" cy="31.5" r="1.5" fill="white"/>
      <!-- Dog nose -->
      <path d="M36,40 Q40,37 44,40 Q44,44 40,45 Q36,44 36,40Z" fill="#1A1A1A"/>
      <!-- Nose highlight -->
      <ellipse cx="40" cy="39.5" rx="2" ry="1" fill="#333"/>
      <!-- Dog mouth -->
      <path d="M40,45 L40,48" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M34,49 Q37,52 40,48 Q43,52 46,49" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Dog tongue -->
      <path d="M37,49 Q40,56 43,49 Q42,53 40,55 Q38,53 37,49Z" fill="#E8720C"/>
      <!-- Dog eyebrows -->
      <path d="M27,28 Q32,25 37,28" fill="none" stroke="#B8862A" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M43,28 Q48,25 53,28" fill="none" stroke="#B8862A" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ===== CAT (right side) ===== -->
  <g clip-path="url(#inner)">
    <g transform="translate(88, 38)">
      <!-- Cat body -->
      <path d="M10,82 Q5,68 12,56 Q20,46 35,43 Q50,46 58,56 Q65,68 60,82 Q45,92 35,93 Q25,92 10,82Z" fill="#E8A040" stroke="#C88030" stroke-width="2"/>
      <!-- Cat chest/belly -->
      <path d="M20,72 Q25,62 35,58 Q45,62 50,72 Q45,85 35,87 Q25,85 20,72Z" fill="#F0D090"/>
      <!-- Cat head -->
      <ellipse cx="35" cy="34" rx="22" ry="20" fill="#E8A040" stroke="#C88030" stroke-width="2"/>
      <!-- Cat face lighter area -->
      <ellipse cx="35" cy="38" rx="14" ry="12" fill="#F0D090"/>
      <!-- Cat left ear -->
      <path d="M16,22 L10,2 L28,16Z" fill="#E8A040" stroke="#C88030" stroke-width="2"/>
      <path d="M17,21 L13,8 L26,17Z" fill="#D4820A"/>
      <!-- Cat right ear -->
      <path d="M54,22 L60,2 L42,16Z" fill="#E8A040" stroke="#C88030" stroke-width="2"/>
      <path d="M53,21 L57,8 L44,17Z" fill="#D4820A"/>
      <!-- Cat forehead stripes -->
      <path d="M28,22 L32,16 L36,22" fill="none" stroke="#C88030" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M34,22 L38,16 L42,22" fill="none" stroke="#C88030" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M30,26 L33,22 L36,26" fill="none" stroke="#C88030" stroke-width="1" stroke-linecap="round"/>
      <path d="M34,26 L37,22 L40,26" fill="none" stroke="#C88030" stroke-width="1" stroke-linecap="round"/>
      <!-- Cat eyes -->
      <ellipse cx="27" cy="33" rx="4" ry="4.5" fill="#1A1A1A"/>
      <ellipse cx="43" cy="33" rx="4" ry="4.5" fill="#1A1A1A"/>
      <!-- Eye highlights -->
      <circle cx="28.5" cy="31.5" r="1.5" fill="white"/>
      <circle cx="44.5" cy="31.5" r="1.5" fill="white"/>
      <!-- Cat nose -->
      <path d="M33,39 L35,37 L37,39 L35,40Z" fill="#E8720C"/>
      <!-- Cat mouth -->
      <path d="M35,40 L35,43" stroke="#1A1A1A" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M31,44 Q33,47 35,43 Q37,47 39,44" fill="none" stroke="#1A1A1A" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Cat whiskers left -->
      <line x1="8" y1="36" x2="23" y2="38" stroke="#1A1A1A" stroke-width="0.8"/>
      <line x1="8" y1="40" x2="23" y2="40" stroke="#1A1A1A" stroke-width="0.8"/>
      <line x1="10" y1="44" x2="23" y2="42" stroke="#1A1A1A" stroke-width="0.8"/>
      <!-- Cat whiskers right -->
      <line x1="47" y1="38" x2="62" y2="36" stroke="#1A1A1A" stroke-width="0.8"/>
      <line x1="47" y1="40" x2="62" y2="40" stroke="#1A1A1A" stroke-width="0.8"/>
      <line x1="47" y1="42" x2="60" y2="44" stroke="#1A1A1A" stroke-width="0.8"/>
    </g>
  </g>

  <!-- ===== HEART (top center, overlaps border) ===== -->
  <g transform="translate(100, 18)">
    <!-- Heart shadow/border -->
    <path d="M0,4 C-3,-2 -12,-6 -14,-2 C-16,3 -10,10 0,16 C10,10 16,3 14,-2 C12,-6 3,-2 0,4Z" fill="#B85500"/>
    <!-- Heart main -->
    <path d="M0,2 C-2.5,-3 -10.5,-6 -12,-2 C-13.5,2.5 -8.5,8.5 0,14 C8.5,8.5 13.5,2.5 12,-2 C10.5,-6 2.5,-3 0,2Z" fill="#E8650A"/>
    <!-- Heart highlight -->
    <path d="M-4,-1 C-6,-4 -9,-3 -8.5,-0.5 C-8,1.5 -5,5 -4,6" fill="none" stroke="#F09040" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- ===== PAW PRINT (top right) ===== -->
  <g transform="translate(135, 38)">
    <circle cx="0" cy="-10" r="5" fill="#0D7377" stroke="#095558" stroke-width="1"/>
    <circle cx="-8" cy="-3" r="4.5" fill="#0D7377" stroke="#095558" stroke-width="1"/>
    <circle cx="8" cy="-3" r="4.5" fill="#0D7377" stroke="#095558" stroke-width="1"/>
    <circle cx="0" cy="5" r="6.5" fill="#0D7377" stroke="#095558" stroke-width="1"/>
  </g>

  <!-- ===== CLOCK (bottom center, overlaps border) ===== -->
  <g transform="translate(100, 152)">
    <!-- Clock outer ring -->
    <circle cx="0" cy="0" r="24" fill="#E8650A"/>
    <!-- Clock face -->
    <circle cx="0" cy="0" r="20" fill="white"/>
    <!-- Clock tick marks -->
    <line x1="0" y1="-17" x2="0" y2="-14" stroke="#E8650A" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="14" x2="0" y2="17" stroke="#E8650A" stroke-width="2" stroke-linecap="round"/>
    <line x1="-17" y1="0" x2="-14" y2="0" stroke="#E8650A" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="0" x2="17" y2="0" stroke="#E8650A" stroke-width="2" stroke-linecap="round"/>
    <!-- Diagonal ticks -->
    <line x1="-12" y1="-12" x2="-10" y2="-10" stroke="#E8650A" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12" y1="-12" x2="10" y2="-10" stroke="#E8650A" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-12" y1="12" x2="-10" y2="10" stroke="#E8650A" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12" y1="12" x2="10" y2="10" stroke="#E8650A" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Clock hour hand (pointing to ~10) -->
    <line x1="0" y1="0" x2="-8" y2="-10" stroke="#E8650A" stroke-width="3" stroke-linecap="round"/>
    <!-- Clock minute hand (pointing to ~2) -->
    <line x1="0" y1="0" x2="10" y2="-6" stroke="#E8650A" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Clock center dot -->
    <circle cx="0" cy="0" r="2.5" fill="#E8650A"/>
  </g>
</svg>
